<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Two-Wire Resistance Measurement</title>
<script src="../slate-circuit-lib.js"></script>
<style>
  html, body { margin: 0; padding: 0; background: #ffffff; }
  svg { display: block; }
</style>
</head>
<body>
<script>
  const c = new Circuit(400, 200);

  const vmeter = c.VMeter(250, 100, {
    label: '',
    fontSize: 18,
    //polarityOffset: 10,
  });

  const isrc = c.dcISource(300, 100, {
    label: 'I_S',
    value: '100 mA',
    side: 'right',
    anchor: 'middle',
    labelGap: 50,
    labelLineHeight: 22,
    fontSize: 18,
  });

  const rLead1 = c.resistor(150, 50, {
    rotate: 0,
    label: 'R_{Lead1}',
    value: '0.5 Ω',
    labelGap: 22,
    labelLineHeight: 22,
    fontSize: 18,
  });

  const rLead2 = c.resistor(150, 150, {
    rotate: 0,
    label: 'R_{Lead2}',
    value: '0.5 Ω',
    labelGap: 22,
    labelLineHeight: 22,
    fontSize: 18,
  });
  
  const rX = c.resistor(50, 100, {
    rotate: -90,
    label: 'R_{X}',
    labelGap: 28,
    fontSize: 18,
  });

  c.wire(rX.top, rLead1.left, {bend:'v'});
  c.wire(rLead1.right, vmeter.top);
  c.wire(rLead1.right, isrc.top);
  
  c.wire(rX.bottom, rLead2.left, {bend:'v'});
  c.wire(rLead2.right, vmeter.bottom);
  c.wire(rLead2.right, isrc.bottom);

  c.dashedBox(310, 100, 170, 150);

  c.text(355, 40, "Ohmmeter");

  // c.wire(r1.left, vmeter.top, { bend: 'v' });
  // c.wire(vmeter.top, isrc.top);
  // c.wire(r1.right, r2.top);
  // const viaPt = { x: 200, y: 170 };
  // c.wire(r2.bottom, viaPt, { bend: 'v' });
  // c.wire(viaPt, vmeter.bottom);
  // c.wire(vmeter.bottom, isrc.bottom);

  c.render(document.body);
</script>
</body>
</html>
